font_family      JetBrainsMono Nerd Font Mono Regular
bold_font        JetBrainsMono Nerd Font Mono Bold
italic_font      JetBrainsMono Nerd Font Mono SemiBold Italic
bold_italic_font JetBrainsMono Nerd Font Mono Bold Italic

font_size 12.0
font_features JetBrainsMono-Regular +liga +calt
font_features JetBrainsMono-Bold +liga +calt
font_features JetBrainsMono-SemiBoldItalic +liga +calt
font_features JetBrainsMono-BoldItalic +liga +calt
modify_font line_height 110%

hide_window_decorations yes
linux_display_server wayland
confirm_os_window_close 0
window_padding_width 20
background_corner_radius 16

background_opacity 0.45
dynamic_background_opacity yes

# Focus-aware opacity: focused = glassy, unfocused = solid
watcher focus_opacity.py

enabled_layouts splits
map ctrl+shift+l launch --location=vsplit
map ctrl+shift+n launch --location=hsplit
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

tab_bar_style       powerline
tab_powerline_style round
tab_bar_min_tabs    2
tab_bar_edge        top
tab_title_template  " {index}  {title} "

# Dark translucent terminal, Tokyo Night palette.
include themes/tokyonight.conf

# === Smooth rendering ===
cursor_shape beam
cursor_beam_thickness 2.0
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.1 0.4
animation_enabled yes
shell_integration enabled
sync_to_vsync yes
