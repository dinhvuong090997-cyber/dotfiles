# Prefer hardware decoding and fall back cleanly for unsupported codecs.
hwdec=auto-safe
vo=gpu-next
gpu-context=wayland

# Expose playback to MPRIS so waybar's music island can see it.
script=/usr/lib/mpv-mpris/mpris.so

# Use yt-dlp (not the legacy youtube-dl name) for opening stream URLs directly
script-opts=ytdl_hook-ytdl_path=yt-dlp

# GPU optimizations for HD630
video-sync=display-resample
keep-open=yes
target-peak=auto
hdr-compute-peak=yes
scale=ewa_lanczossharp
cscale=lanczos
dscale=lanczos
